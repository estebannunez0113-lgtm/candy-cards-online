/* RESPONSIVE FIXES: scrollable menus, visible battle controls, portrait waves. */
html, body { width:100%; min-height:100%; overflow:hidden; }
#app {
  width:100%;
  height:100dvh;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-gutter:stable;
}
.section { min-width:0; }
.battle-arena {
  height:500px;
  min-height:500px;
  overflow:visible;
}
.battle-side { top:16px; }
.battle-card { height:275px; }
.battle-card canvas { height:125px; }
.battle-actions { position:relative; z-index:2; padding:5px 0 4px; }
.battle-actions button { min-height:44px; }
.log { margin-bottom:20px; }
.wave-page { width:100%; height:100dvh; min-height:100%; }
#waveCanvas { width:100%; height:100%; display:block; }

@media (max-width:720px) and (orientation:portrait) {
  .waveHUD {
    height:70px;
    display:grid;
    grid-template-columns:minmax(105px,1.15fr) minmax(70px,.9fr) minmax(55px,.65fr);
    grid-template-rows:26px 20px;
    align-content:center;
    align-items:center;
    gap:3px 6px;
    padding:5px 7px;
  }
  .waveHP { grid-column:1; grid-row:1; width:100%; min-width:0; height:18px; }
  .waveHUD #candyText { grid-column:2; grid-row:1; min-width:0; white-space:nowrap; }
  .waveHUD #waveText { grid-column:3; grid-row:1; min-width:0; white-space:nowrap; }
  .waveHUD #cardText { grid-column:1 / 4; grid-row:2; font-size:11px; line-height:14px; }
  .waveHUD .txt { font-size:clamp(10px,2.9vw,14px); line-height:1.1; }
  .waveButtons {
    top:76px;
    left:5px;
    right:5px;
    max-width:none;
    justify-content:center;
    flex-wrap:wrap;
    gap:4px;
  }
  .waveButtons button { font-size:11px; padding:5px 7px; }
  .touch-joystick { width:112px; height:112px; left:12px; bottom:13px; border-width:3px; }
  .touch-knob { width:48px; height:48px; }
  .attack-touch { width:88px; height:88px; right:13px; bottom:17px; font-size:13px; border-width:4px; }
  .battle-arena {
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:start;
    gap:6px;
    width:100%;
    height:auto;
    min-height:0;
    padding:10px 6px 14px;
    overflow:visible;
  }
  .battle-side, .battle-side.left, .battle-side.right {
    position:static;
    top:auto; left:auto; right:auto;
    width:auto;
    min-width:0;
    text-align:center;
  }
  .battle-side > b { font-size:clamp(11px,3.2vw,16px); overflow-wrap:anywhere; }
  .battle-card {
    width:100%;
    max-width:220px;
    height:auto;
    min-height:225px;
    margin:7px auto;
    padding:5px;
    border-width:3px;
    overflow:hidden;
  }
  .battle-card canvas { width:100%; max-width:150px; height:105px; margin:5px auto; }
  .battle-stats { gap:3px; font-size:clamp(9px,2.55vw,13px); white-space:nowrap; }
  .battle-card b { display:block; font-size:clamp(10px,2.9vw,14px); line-height:1.15; overflow-wrap:anywhere; }
  .battle-card div[style*="font-weight:900"] { font-size:clamp(10px,2.8vw,14px); }
  .hpbox { width:100%; height:17px; margin:6px auto 0; }
  .vs { display:none; }
  .battle-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
  .battle-actions button { min-width:0; width:100%; font-size:clamp(12px,3.4vw,16px); padding:8px 5px; }
  .topbar { max-width:100%; }
  .section h1 { overflow-wrap:anywhere; }
}

@media (max-width:850px) and (orientation:landscape) {
  .waveHUD { gap:8px; padding:7px 10px; }
  .waveHP { width:clamp(115px,22vw,200px); }
  .waveHUD .txt { font-size:clamp(13px,2.2vw,19px); }
  .waveButtons { top:67px; right:6px; gap:5px; }
  .waveButtons button { font-size:12px; padding:5px 7px; }
  .touch-joystick { width:105px; height:105px; left:12px; bottom:12px; }

  .attack-touch { width:88px; height:88px; right:14px; bottom:14px; }
  .battle-arena { height:420px; min-height:420px; }
  .battle-side { width:175px; }

@media (max-height:560px) and (orientation:landscape) {
  .battle-arena { height:360px; min-height:360px; }

}

/* CANDY GALAXY ULTRA GRAPHICS UPDATE */
:root{--dark-bg:#090b24;--panel:#111536;--panel2:#1a2050;--purple:#a45bff;--blue:#35d9ff;--yellow:#ffe878;--pink:#ff54ce;--green:#5affbc}
html,body{background:#08091d;background-image:radial-gradient(ellipse at 12% 15%,rgba(92,52,198,.24),transparent 38%),radial-gradient(ellipse at 86% 20%,rgba(0,183,255,.17),transparent 34%),radial-gradient(ellipse at 50% 100%,rgba(255,52,194,.13),transparent 45%)}
body:before{content:"";position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:.38;background-image:radial-gradient(2px 2px at 8% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 22% 72%,#9fefff 98%,transparent),radial-gradient(2px 2px at 41% 28%,#fff 98%,transparent),radial-gradient(1px 1px at 62% 81%,#e2a8ff 98%,transparent),radial-gradient(2px 2px at 83% 43%,#fff 98%,transparent),radial-gradient(1px 1px at 93% 12%,#8ef7ff 98%,transparent),radial-gradient(1px 1px at 70% 8%,#fff 98%,transparent);background-size:410px 320px;animation:galaxyDrift 42s linear infinite}
@keyframes galaxyDrift{from{background-position:0 0}to{background-position:410px 320px}}
@keyframes candyGlow{0%,100%{box-shadow:0 0 8px #754cff55,0 0 20px #24d8ff20,inset 0 0 9px #ffffff08}50%{box-shadow:0 0 14px #b65cff88,0 0 28px #24d8ff40,inset 0 0 13px #ffffff12}}
@keyframes holoSweep{0%{background-position:-180% 0}100%{background-position:180% 0}}
@keyframes floatCandy{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#app{position:relative;z-index:1}
.page,.canvas-page{background-color:#090b24;background-image:radial-gradient(ellipse at 14% 8%,rgba(106,70,255,.19),transparent 40%),radial-gradient(ellipse at 88% 80%,rgba(0,214,255,.11),transparent 35%)}
button{border:1px solid rgba(190,211,255,.72);border-radius:13px;background:linear-gradient(145deg,#373a72,#1b1d49 65%,#30215b);box-shadow:0 4px 0 #08091b,0 0 12px #725cff35,inset 0 1px 0 #ffffff2b;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;position:relative;overflow:hidden}
button:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 20%,#ffffff15 44%,#ffffff03 56%,transparent 78%);background-size:220% 100%;animation:holoSweep 7s linear infinite}
button:hover{filter:brightness(1.25) saturate(1.16);transform:translateY(-2px);box-shadow:0 5px 0 #08091b,0 0 18px #4fdfff44,inset 0 1px 0 #ffffff44}
button:active{transform:translateY(1px);box-shadow:0 1px 0 #08091b,inset 0 2px 8px #0005}
button.green{background:linear-gradient(135deg,#20b98b,#147b8c)}button.blue{background:linear-gradient(135deg,#1689df,#4735b9)}button.purple{background:linear-gradient(135deg,#bb4dff,#6129be)}button.orange{background:linear-gradient(135deg,#ff9c40,#d64a77)}button.gold{background:linear-gradient(135deg,#ffe78b,#d89a28 55%,#87501a);color:#24133c;text-shadow:0 1px #fff7}button.red{background:linear-gradient(135deg,#ff527d,#a82063)}button.gray{background:linear-gradient(135deg,#555d86,#292d4d)}
.og-title,.section h1,.modal-box h1{background:linear-gradient(100deg,#fff,#a5f5ff 22%,#ffb9f5 46%,#fff2a6 67%,#c9b3ff 84%,#fff);background-size:220% auto;color:transparent;background-clip:text;-webkit-background-clip:text;text-shadow:0 0 20px #8a64ff55;animation:galaxyTitle 9s linear infinite}

.modal{background:radial-gradient(ellipse at center,#17144cdd,#050615f5);backdrop-filter:blur(7px)}
.modal-box{background:linear-gradient(145deg,rgba(25,28,72,.98),rgba(10,13,37,.98));border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 1px #9e8affaa,0 0 28px #725cff55,0 0 65px #16c9ff1b;border-radius:20px;position:relative}
.modal-box:before{content:"";position:absolute;inset:-2px;border-radius:21px;padding:2px;background:linear-gradient(125deg,#65edff,#9b58ff,#ff75d7,#ffe98d,#65edff);background-size:260% 260%;animation:galaxyBorder 9s linear infinite;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
@keyframes galaxyBorder{to{background-position:260% 0}}
.panel,.card,.pack-item,.battle-card,.shop-bundle-grid .panel,.skin-box{background:linear-gradient(150deg,rgba(37,43,94,.96),rgba(14,17,48,.98));border-color:#8b9bff88!important;box-shadow:0 0 13px #4b6cff26,inset 0 1px 0 #ffffff14;}
.card,.pack-item,.battle-card{border-radius:15px;position:relative;overflow:hidden}
.card:after,.pack-item:after,.battle-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 10%,#ffffff09 45%,transparent 70%);background-size:220% 100%;animation:holoSweep 11s linear infinite}
.card:hover,.pack-item:hover{transform:translateY(-3px);box-shadow:0 0 20px #9d6bff66}
input,select,textarea{background:#0b1030!important;color:#fff!important;border:1px solid #7eeeffaa!important;border-radius:10px!important;box-shadow:inset 0 0 12px #222a7044}
.topbar{background:linear-gradient(90deg,#111536ee,#24205bee,#111536ee);border:1px solid #8b9bff55;border-radius:14px;box-shadow:0 0 18px #5d5dff22}
.toast{border:1px solid #86edff!important;background:linear-gradient(135deg,#28205e,#111735)!important;box-shadow:0 0 24px #48dfff66!important;border-radius:13px!important}
.shop-bundle-grid .panel{animation:candyGlow 5s ease-in-out infinite}
canvas.game{filter:saturate(1.13) contrast(1.04)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}

    const design=bossDesignForWave(w);
    if(design)return design.name;
    if(BOSS_NAMES[w])return BOSS_NAMES[w];
    const i=Math.max(0,Math.floor(w/5)-11);
    const adjective=BOSS_ADJECTIVES[i%BOSS_ADJECTIVES.length];
    const creature=BOSS_CREATURES[Math.floor(i/BOSS_ADJECTIVES.length)%BOSS_CREATURES.length];
    const tier=Math.floor((w-1)/50)+1;
    return `${adjective} ${creature} — TIER ${tier}`;
}
function bossColorForWave(w){
    const design=bossDesignForWave(w);

function clone(v){return JSON.parse(JSON.stringify(v));}
let audioCtx=null;
function ensureAudio(){
    try{
        if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
        if(audioCtx.state==="suspended") audioCtx.resume();
        return audioCtx;
    }catch{return null;}
}
function tone(freq,duration,type="sine",volume=.055,slide=0){
    const ac=ensureAudio();
    if(!ac)return;
    const o=ac.createOscillator();
    const g=ac.createGain();
    const now=ac.currentTime;
    o.type=type;o.frequency.setValueAtTime(freq,now);
    if(slide) o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),now+duration);
    g.gain.setValueAtTime(volume,now);
    g.gain.exponentialRampToValueAtTime(.0001,now+duration);
    o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+duration+.02);
}

function loadSave(){
    try{
        const keys=["candyCardsFullWebSave","candyCardsMainPyWeb","candyCardsWebSave"];
        let parsed=null;
        for(const key of keys){
            const raw=localStorage.getItem(key);
            if(raw){parsed=JSON.parse(raw);break;}
        }
        if(!parsed) return clone(DEFAULT_SAVE);
        const out=Object.assign(clone(DEFAULT_SAVE),parsed);
        /* Migrate older web-save field names into the main.py names. */
        if(!out.cards_owned && parsed.cards) out.cards_owned=parsed.cards;
        if(!out.pets_owned && parsed.pets) out.pets_owned=parsed.pets;
        if(!out.equipped_pet && parsed.equippedPet) out.equipped_pet=parsed.equippedPet;
        if(!out.equipped_skin && parsed.skin) out.equipped_skin=parsed.skin;
        if(!out.current_wave && parsed.wave) out.current_wave=parsed.wave;
        if(!Number.isFinite(Number(out.player_health))) out.player_health=out.player_max_health||100;
        out.current_wave=Math.max(1,Math.min(MAX_WAVES,Math.floor(Number(out.current_wave)||1)));
        if(Object.prototype.hasOwnProperty.call(parsed,"highest_wave_cleared") && Number.isFinite(Number(parsed.highest_wave_cleared))){
            out.highest_wave_cleared=Math.max(0,Math.min(MAX_WAVES,Math.floor(Number(parsed.highest_wave_cleared))));
        }else{
            // Older saves store the next wave to play, so the previous wave was cleared.
            out.highest_wave_cleared=Math.max(0,Math.min(MAX_WAVES,out.current_wave-1));
        }
        out.cards_owned=(out.cards_owned&&typeof out.cards_owned==="object")?out.cards_owned:{};
        out.pets_owned=(out.pets_owned&&typeof out.pets_owned==="object")?out.pets_owned:{};
        out.candy_gems=Math.max(0,Math.floor(Number(out.candy_gems)||0));
        out.owned_cosmetics=Array.isArray(out.owned_cosmetics)?out.owned_cosmetics:[];
        out.equipped_cosmetic=String(out.equipped_cosmetic||"None");
        out.last_gem_gift=String(out.last_gem_gift||"");
        out.redeemed_codes=Array.isArray(out.redeemed_codes)?out.redeemed_codes.map(x=>String(x).toLowerCase()):[];
        return out;
    }catch{return clone(DEFAULT_SAVE);}
}

function highestWaveCleared(){
    const recorded=Math.max(0,Math.floor(Number(save.highest_wave_cleared)||0));
    const inferred=Math.max(0,Math.floor(Number(save.current_wave)||1)-1);
    return Math.min(MAX_WAVES,Math.max(recorded,inferred));
}

let currentLanguage = localStorage.getItem("candyCardsLanguage") || "en";

function translateHtml(html){
    const lang = LANGUAGES[currentLanguage] || LANGUAGES.en;
    let out = html;
    const entries = Object.entries(lang.strings).sort((a,b)=>b[0].length-a[0].length);
    for(const [from,to] of entries){
        out = out.split(from).join(to);
    }
    return out;
}

function languageSelectorHtml(){
    return `<select class="language-select" aria-label="Language" onchange="changeLanguage(this.value)">
        ${Object.entries(LANGUAGES).map(([code,lang])=>`<option value="${code}" ${code===currentLanguage?"selected":""}>${lang.name}</option>`).join("")}
    </select>`;
}

function addLanguageControlToMenu(html){
    return html.replace('</button>\n        <div class="og-title">','</button>\n        <div class="language-corner">'+languageSelectorHtml()+'</div>\n        <div class="og-title">');
}

function changeLanguage(code){
    if(!LANGUAGES[code]) return;
    currentLanguage=code;
    localStorage.setItem("candyCardsLanguage",code);
    menu();
}

function render(html){
    const translated = translateHtml(html);
    document.getElementById("app").innerHTML=translated;
    const root=document.getElementById("app");
    root.querySelectorAll("[data-language-anchor]").forEach(x=>x.innerHTML=languageSelectorHtml());
}

function chooseWavePage(){
    currentMode="choose-wave";
    const cleared=highestWaveCleared();
    const waveButtons=cleared>0?Array.from({length:cleared},(_,i)=>{
        const w=i+1;
        const isBoss=w%5===0;
        const bossLabel=isBoss?`<small>${esc(bossNameForWave(w))}</small>`:"";

function cardsPage(){

function renderCard(c){
    const [name,rarity]=c; const amount=Number(save.cards_owned[name]||0);
    if(!amount)return `<div class="collection-card locked"><div style="font-size:70px;margin-top:30px">?</div><div class="card-name">LOCKED</div><div class="card-rarity" style="color:#888">${rarity}</div></div>`;
    return `<div class="collection-card" style="border-color:${RARITY_COLORS[rarity]}"><canvas width="145" height="108" data-card="${esc(name)}"></canvas><div class="card-name">${esc(name)}</div><div class="card-rarity" style="color:${RARITY_COLORS[rarity]}">${rarity}</div><div class="card-amount">x${amount}</div><button class="small" onclick="equipCard('${encodeURIComponent(name)}')">${save.equipped_card===name?"EQUIPPED":"USE IN BATTLE"}</button></div>`;
}
function equipCard(encoded){const name=decodeURIComponent(encoded);if(!save.cards_owned[name])return toast("YOU DO NOT OWN THAT CARD!");save.equipped_card=name;saveGame();toast(name+" EQUIPPED!");cardsPage();}
function weightedRarity(){let roll=Math.random()*100,total=0;for(const r of RARITIES){total+=RARITY_CHANCES[r];if(roll<=total)return r;}return "Common";}
function randomCard(){const r=weightedRarity();const list=CANDY_CARDS.filter(c=>c[1]===r);return list[Math.floor(Math.random()*list.length)]||CANDY_CARDS[0];}
function randomPet(){
    // Chipy is excluded from ordinary random rolls so his custom drop chance is respected.
    const ordinaryPets=PETS.filter(p=>p.name!=="Chipy");
    return ordinaryPets[Math.floor(Math.random()*ordinaryPets.length)];
}
function rollPet(){
    const chipy=pet("Chipy");
    return chipy && Math.random()<chipy.drop_chance ? chipy : randomPet();
}
function openPack(){
    ensureAudio();
    if(save.candy_credits<10)return toast("NOT ENOUGH CANDY!");
    save.candy_credits-=10;
    sfxCollect();
    const got=[randomCard(),randomCard()];
    const p=rollPet();
    for(const c of got)save.cards_owned[c[0]]=(save.cards_owned[c[0]]||0)+1;
    save.pets_owned[p.name]=(save.pets_owned[p.name]||0)+1;
    saveGame();
    const modal=document.createElement("div");modal.className="modal";
    modal.innerHTML=`<div class="modal-box"><h1>PACK OPENED!</h1><h2>2 CARDS + 1 PET</h2><div class="pack-grid">${got.map(c=>`<div class="pack-item" style="border-color:${RARITY_COLORS[c[1]]}"><canvas width="145" height="108" data-card="${esc(c[0])}"></canvas><h3>${esc(c[0])}</h3><b style="color:${RARITY_COLORS[c[1]]}">${c[1]}</b></div>`).join("")}<div class="pack-item" style="border-color:${RARITY_COLORS[p.rarity]}"><canvas class="pack-pet-canvas" width="145" height="108" data-pet="${esc(p.name)}"></canvas><h3>${esc(p.name)}</h3><b style="color:${RARITY_COLORS[p.rarity]}">${p.rarity} PET</b></div></div><br><button onclick="this.closest('.modal').remove();cardsPage()">CONTINUE</button></div>`;
    document.body.appendChild(modal);paintCardCanvases();paintPetCanvases();
}

function paintCardCanvases(){document.querySelectorAll("canvas[data-card]").forEach(c=>drawCardArt(c.getContext("2d"),c.dataset.card,c.width,c.height));}
function drawCardArt(ctx,name,w,h){
    // Each card gets a specific silhouette, palette, face, markings and effects.
    // Draw in a consistent 145 x 108 design space, then scale for battle cards.
    ctx.clearRect(0,0,w,h);
    ctx.save();
    ctx.scale(w/145,h/108);
    const found=card(name), rarity=found[1], rarityColor=RARITY_COLORS[rarity]||"#b4b4b4";
    const low=String(name).toLowerCase();
    let seed=2166136261;
    for(let i=0;i<name.length;i++){seed^=name.charCodeAt(i);seed=Math.imul(seed,16777619)>>>0;}
    const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
    const choose=a=>a[Math.floor(rand()*a.length)];
    const cx=72.5, cy=52;
    const circ=(x,y,r,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);ctx.fill();};
    const ellipse=(x,y,rx,ry,col,rot=0)=>{ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,Math.PI*2);ctx.fill();};
    const rect=(x,y,ww,hh,col,rad=0)=>{ctx.fillStyle=col;if(rad){ctx.beginPath();ctx.roundRect(x,y,ww,hh,rad);ctx.fill();}else ctx.fillRect(x,y,ww,hh);};
    const line=(x1,y1,x2,y2,col,width=2)=>{ctx.strokeStyle=col;ctx.lineWidth=width;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
    const poly=(pts,col,stroke=null,lw=2)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}};
    const star=(x,y,r,col,inner=.48,points=5,rotation=-Math.PI/2)=>{const pts=[];for(let i=0;i<points*2;i++){const a=rotation+i*Math.PI/points,rr=i%2?r*inner:r;pts.push([x+Math.cos(a)*rr,y+Math.sin(a)*rr]);}poly(pts,col);};
    const aura=(x,y,r,col,alpha=.3)=>{ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r+5,0,Math.PI*2);ctx.stroke();ctx.restore();};
    const darken=(col)=>{if(!/^#[0-9a-f]{6}$/i.test(col))return "#252033";let n=parseInt(col.slice(1),16);return "#"+[16,8,0].map(s=>Math.max(0,((n>>s)&255)-48).toString(16).padStart(2,"0")).join("");};
    const lighten=(col)=>{if(!/^#[0-9a-f]{6}$/i.test(col))return "#ffffff";let n=parseInt(col.slice(1),16);return "#"+[16,8,0].map(s=>Math.min(255,((n>>s)&255)+65).toString(16).padStart(2,"0")).join("");};

    const rIndex=Math.max(0,RARITIES.indexOf(rarity));
    const baseByType={
      lollipop:low.includes("blue")?"#408dff":low.includes("gold")?"#ffca29":low.includes("rainbow")?"#ff5d91":low.includes("fire")?"#f34a36":low.includes("galaxy")?"#a05cff":low.includes("shadow")?"#373344":low.includes("diamond")||low.includes("crystal")?"#71dcff":low.includes("secret")||low.includes("invisible")||low.includes("lost")?"#b1a7ed":low.includes("green")?"#45ce67":"#ff414a",
      broccoli:low.includes("gold")?"#e6b82e":low.includes("shadow")?"#48415d":low.includes("diamond")?"#68ddd8":low.includes("thunder")?"#7a91ff":"#45c965",
      steak:low.includes("gold")?"#e8ae2f":low.includes("fire")||low.includes("lava")?"#f05a32":low.includes("diamond")?"#63d8e8":low.includes("shadow")?"#4a4058":"#b36b3e",
      cookie:low.includes("chocolate")?"#7b442f":"#d99c50",
      dessert:low.includes("ice")||low.includes("frost")||low.includes("frozen")?"#71d5ff":low.includes("chocolate")?"#94543d":low.includes("rainbow")?"#ff5fbb":"#ff86bf",
      gem:low.includes("diamond")?"#7ceaff":low.includes("cosmic")?"#b28aff":"#78e6f4",
      magic:low.includes("fire")||low.includes("lava")?"#ff6238":low.includes("thunder")?"#ffe14f":low.includes("frost")||low.includes("ice")?"#84e9ff":low.includes("rainbow")?"#ff68b7":"#af70ff"
    };
    let type="candy";
    if(low.includes("dragon"))type="dragon";
    else if(low.includes("broccoli"))type="broccoli";
    else if(low.includes("steak"))type="steak";
    else if(low.includes("lollipop"))type="lollipop";
    else if(low.includes("cookie"))type="cookie";
    else if(low.includes("donut"))type="donut";
    else if(low.includes("cupcake"))type="cupcake";
    else if(low.includes("ice cream"))type="icecream";
    else if(low.includes("gumdrop"))type="gumdrop";
    else if(low.includes("marshmallow"))type="marshmallow";
    else if(low.includes("jelly bean"))type="jellybean";
    else if(low.includes("sugar cube"))type="cube";
    else if(low.includes("diamond")||low.includes("crystal")||low.includes("prismatic"))type="gem";
    else if(low.includes("rainbow"))type="rainbow";
    else if(low.includes("galaxy")||low.includes("cosmic")||low.includes("star"))type="cosmic";
    else if(low.includes("invisible")||low.includes("phantom")||low.includes("shadow")||low.includes("ghost")||low.includes("unknown")||low.includes("lost"))type="spectral";

    else if(low.includes("sugar"))type="sugar";
    else if(low.includes("candy"))type="candy";
    const color=baseByType[type]||choose(["#ff5b88","#ffb83f","#65d9f2","#a56bff","#4bd782","#ff6a4e"]);
    const shade=darken(color), shine=lighten(color);

    // Art backdrop: rarity glow, distinct scattered sparks and a tiny rarity crest.
    const bg=ctx.createLinearGradient(0,0,145,108);bg.addColorStop(0,"#242035");bg.addColorStop(.55,"#161321");bg.addColorStop(1,darken(rarityColor));
    rect(0,0,145,108,bg);
    const glow=ctx.createRadialGradient(cx,cy,2,cx,cy,66);glow.addColorStop(0,color+"55");glow.addColorStop(1,"#11101a00");rect(0,0,145,108,glow);
    for(let i=0;i<5+rIndex*2;i++){const x=5+rand()*135,y=5+rand()*98;star(x,y,1+rand()*(1.8+rIndex*.14),rand()>.22?"#ffffff":"#ffe45c",.5,4);}

    const x0=cx,y0=cy;
    ctx.save();ctx.translate(cx,cy);ctx.scale(size,size);ctx.translate(-cx,-cy);

    // Object-specific silhouettes; variants change shape, expression, markings and accessories.
    if(type==="lollipop"){
      rect(cx-5,cy+13,10,44,"#fff5e7",4);line(cx,cy+20,cx,cy+53,"#d8e1ec",2);
      const shape=Math.floor(rand()*4);
      if(shape===0)circ(cx,cy-6,29,color);
      else if(shape===1)star(cx,cy-6,35,color,.75,8,-Math.PI/8);
      else if(shape===2)poly([[cx,cy-43],[cx+31,cy-8],[cx+19,cy+25],[cx-19,cy+25],[cx-31,cy-8]],color);
      else {poly([[cx-28,cy-27],[cx+28,cy-27],[cx+36,cy-4],[cx+20,cy+23],[cx-20,cy+23],[cx-36,cy-4]],color);}
      circ(cx-8,cy-16,8,shine);ctx.strokeStyle=shine;ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy-6,18,.1+rand(),2.3+rand());ctx.stroke();
      if(low.includes("peppermint")||low.includes("swirl")||name==="Red Lollipop"||name==="Blue Lollipop"){for(let j=0;j<3;j++)line(cx-18+j*8,cy-20,cx-7+j*8,cy+8,choose(["#fff7ec","#ffc2cf"]),3);}
    } else if(type==="broccoli"){
      // Different florets create a recognisable broccoli silhouette each time.
      rect(cx-8,cy+5,16,40,"#8ccf7a",5);rect(cx-5,cy+12,10,31,"#c7ed9e",3);
      const florets=6+Math.floor(rand()*5);for(let i=0;i<florets;i++){const a=rand()*Math.PI*2,rr=10+rand()*13,rad=8+rand()*9;circ(cx+Math.cos(a)*rr,cy-9+Math.sin(a)*rr,rad,choose([color,shade,shine]));}
      circ(cx-8,cy-8,3,"#161321");circ(cx+8,cy-8,3,"#161321");
      if(low.includes("angry")||low.includes("beast")||low.includes("crusher")){line(cx-14,cy-15,cx-5,cy-12,"#20202a",3);line(cx+5,cy-12,cx+14,cy-15,"#20202a",3);poly([[cx-8,cy+1],[cx+8,cy+1],[cx+3,cy+7],[cx-3,cy+7]],"#fff");}
      else {ctx.strokeStyle="#17211a";ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy-2,8,.25,Math.PI-.25);ctx.stroke();}
      if(low.includes("turbo")) {line(cx-34,cy-18,cx-22,cy-18,"#fff",3);line(cx-37,cy-7,cx-24,cy-7,"#fff",2);}
    } else if(type==="steak"){
      poly([[cx-37,cy-13],[cx-28,cy-29],[cx-9,cy-34],[cx+12,cy-29],[cx+32,cy-18],[cx+39,cy-1],[cx+26,cy+20],[cx+4,cy+29],[cx-23,cy+24],[cx-38,cy+7]],color,shade,3);
      poly([[cx-25,cy-12],[cx-11,cy-22],[cx+8,cy-21],[cx+23,cy-9],[cx+25,cy+6],[cx+8,cy+17],[cx-14,cy+14],[cx-27,cy+1]],"#e59b64");
      for(let i=0;i<4;i++){const xx=cx-20+rand()*40,yy=cy-15+rand()*31;line(xx-3,yy-2,xx+3,yy+2,choose(["#58321f","#61351f"]),2);}

      if(low.includes("king")||low.includes("god")||low.includes("ultimate")||low.includes("op")){poly([[cx+10,cy-25],[cx+13,cy-36],[cx+20,cy-28],[cx+28,cy-38],[cx+31,cy-23]],"#ffd54b");}
      if(low.includes("fire")||low.includes("lava")){poly([[cx-18,cy+12],[cx-30,cy+26],[cx-13,cy+22],[cx-5,cy+32],[cx+3,cy+23]],"#ff613c");}
    } else if(type==="cookie"){

function petsPage(){
    currentMode="pets";
    render(`${topbar()}<div class="section"><h1>PET COLLECTION</h1><div class="panel center">Equipped: <b>${esc(save.equipped_pet||"None")}</b> • Collected ${countPets()}/${PETS.length}</div><div class="scroll"><div class="grid5">${PETS.map(p=>{
        const o=Number(save.pets_owned[p.name]||0);
        return `<div class="pet-card" style="border-color:${RARITY_COLORS[p.rarity]};opacity:${o?1:.55}"><canvas class="pet-canvas" width="180" height="105" data-pet="${esc(p.name)}"></canvas><div class="card-name">${o?esc(p.name):"LOCKED"}</div><div class="card-rarity" style="color:${RARITY_COLORS[p.rarity]}">${p.rarity}</div><div class="card-amount">x${o}</div><div class="small-text">Damage ${p.damage} • Speed ${p.speed} • Range ${p.range} • Candy +${p.credits}</div>${p.name==="Chipy"?`<div style="font-size:10px;font-weight:900;color:#ff4dff">DROP CHANCE: 1 IN 10 QUADRILLION</div>`:""}${o?`<button class="small pet-use-btn" onclick="equipPet('${encodeURIComponent(p.name)}')">${save.equipped_pet===p.name?"USED":"USE"}</button>`:""}</div>`;
    }).join("")}</div></div></div>`);
    paintPetCanvases();
}
function equipPet(encoded){
    const name=decodeURIComponent(String(encoded));
    const owned=Number(save.pets_owned[name]||0);
    if(owned<=0){
        toast("YOU DO NOT OWN THAT PET!");
        sfxError();
        return;
    }
    save.equipped_pet=name;
    saveGame();
    sfxClick();
    toast(name+" EQUIPPED!");
    petsPage();
}

function paintPetCanvases(){
    document.querySelectorAll("canvas[data-pet]").forEach(c=>{
        const p=pet(c.dataset.pet);
        if(p) drawPetArt(c.getContext("2d"),c.width/2,55,p,1.0);
    });
}

function openUpgradeShop(){if(waveState&&!waveState.finished)waveState.running=false;upgradePage();}
function upgradePage(){
    currentMode="upgrade-shop";
    const continueLabel=waveState&&waveState.finished?"NEXT WAVE":waveState&&!waveState.running?"RESUME WAVE":"START WAVES";
    render(`${topbar()}<div class="section"><h1>🍬 UPGRADE SHOP</h1><div class="panel center"><h2>SPEND CANDY TO GET STRONGER</h2><p>Upgrade your lollipop after each cleared level. Your upgrades are saved automatically.</p><p>🍬 Candy: <b>${save.candy_credits.toLocaleString()}</b></p><p>HP ${save.player_health}/${save.player_max_health} • Damage ${save.player_damage} • Speed ${save.player_speed} • Range ${save.player_attack_range}</p></div><div class="shop-bundle-grid"><div class="skin-box"><h2>❤️ HEALTH</h2><p>Increase maximum health by 20 and heal 20.</p><p>Level ${save.health_level}</p><button class="green" onclick="buyHealth()">UPGRADE — 10 🍬</button></div><div class="skin-box"><h2>⚔️ DAMAGE</h2><p>Increase attack damage by 5.</p><p>Level ${save.damage_level}</p><button class="orange" onclick="buyDamage()">UPGRADE — 15 🍬</button></div><div class="skin-box"><h2>💨 SPEED</h2><p>Move faster by +0.5.</p><p>Level ${save.speed_level}</p><button class="blue" onclick="buySpeed()">UPGRADE — 20 🍬</button></div><div class="skin-box"><h2>🎯 RANGE</h2><p>Increase attack range by 15.</p><p>Level ${save.range_level}</p><button class="purple" onclick="buyRange()">UPGRADE — 20 🍬</button></div><div class="skin-box"><h2>🃏 CARD PACK</h2><p>Get 2 cards and 1 pet.</p><button class="gold" onclick="openPack()">BUY PACK — 10 🍬</button></div></div><div class="shop-continue"><button class="green" onclick="${waveState&&waveState.finished?'startWaves()':waveState?'resumeWaves()':'startWaves()'}">${continueLabel}</button><button class="purple" onclick="shopPage()">CANDY GEM SHOP</button><button class="dark" onclick="menu()">MAIN MENU</button></div></div>`);

function claimDailyGems(){const today=new Date().toISOString().slice(0,10);if(save.last_gem_gift===today)return toast("DAILY GEMS ALREADY CLAIMED!");save.last_gem_gift=today;save.candy_gems+=10;saveGame();sfxCollect();shopPage();toast("DAILY GIFT: +10 CANDY GEMS!");}
function buyGemBundle(id){const b=GEM_BUNDLES.find(x=>x.id===id);if(!b)return;if(save.candy_gems<b.cost)return toast("NOT ENOUGH CANDY GEMS!");save.candy_gems-=b.cost;save.candy_credits+=b.candy;for(let i=0;i<b.packs;i++){const c1=randomCard(),c2=randomCard(),p=rollPet();save.cards_owned[c1[0]]=(save.cards_owned[c1[0]]||0)+1;save.cards_owned[c2[0]]=(save.cards_owned[c2[0]]||0)+1;save.pets_owned[p.name]=(save.pets_owned[p.name]||0)+1;}for(let i=0;i<b.pets;i++){const p=rollPet();save.pets_owned[p.name]=(save.pets_owned[p.name]||0)+1;}saveGame();sfxWin();shopPage();toast(b.name+" PURCHASED!");}
function buyGemCosmetic(id){const c=GEM_COSMETICS.find(x=>x.id===id);if(!c)return;if(save.owned_cosmetics.includes(id))return equipGemCosmetic(id);if(save.candy_gems<c.cost)return toast("NOT ENOUGH CANDY GEMS!");save.candy_gems-=c.cost;save.owned_cosmetics.push(id);save.equipped_cosmetic=id;saveGame();sfxCollect();shopPage();toast(c.name+" UNLOCKED!");}
function equipGemCosmetic(id){if(id!=="none"&&!save.owned_cosmetics.includes(id))return toast("COSMETIC NOT OWNED!");save.equipped_cosmetic=id==="none"?"None":id;saveGame();shopPage();toast(id==="none"?"AURA REMOVED!":"COSMETIC EQUIPPED!");}

function buyDamage(){if(save.candy_credits<15)return toast("NOT ENOUGH CANDY!");save.candy_credits-=15;save.player_damage+=5;save.damage_level++;sfxCollect();saveGame();toast("DAMAGE +5!");upgradePage();}

function setResponsiveWaveDimensions(){
    // Keep the canvas coordinate system at the same aspect ratio as the visible screen.
    // In portrait, the world becomes taller instead of stretching circles and characters.
    const aspect = Math.max(0.25, Math.min(4, window.innerWidth / Math.max(1, window.innerHeight)));
    WIDTH = 1280;
    HEIGHT = Math.max(360, Math.round(WIDTH / aspect));

    const canvas = document.getElementById("waveCanvas");
    if(canvas){
        if(canvas.width !== WIDTH) canvas.width = WIDTH;
        if(canvas.height !== HEIGHT) canvas.height = HEIGHT;
    }

    if(typeof waveState !== "undefined" && waveState){
        if(waveState.player){
            waveState.player.x = Math.max(45, Math.min(WIDTH - 45, waveState.player.x));
            waveState.player.y = Math.max(100, Math.min(HEIGHT - 70, waveState.player.y));
        }
        for(const enemy of (waveState.enemies || [])){
            const r = Number(enemy.radius || 30);
            enemy.x = Math.max(r + 5, Math.min(WIDTH - r - 5, enemy.x));
            enemy.y = Math.max(110 + r, Math.min(HEIGHT - r - 25, enemy.y));
        }
        for(const pickup of (waveState.pickups || [])){
            pickup.x = Math.max(20, Math.min(WIDTH - 20, pickup.x));
            pickup.y = Math.max(100, Math.min(HEIGHT - 20, pickup.y));
        }
    }
}

function startWaves(requestedWave=null){
    let selectedWave;
    if(requestedWave!==null && requestedWave!==undefined){
        selectedWave=Math.floor(Number(requestedWave));
        if(!Number.isFinite(selectedWave)||selectedWave<1||selectedWave>highestWaveCleared()){
            toast("YOU CAN ONLY REPLAY WAVES YOU HAVE CLEARED!");
            sfxError();
            return;
        }
    }else{
        selectedWave=Math.max(1,Math.min(MAX_WAVES,Number(save.current_wave)||1));
    }
    setResponsiveWaveDimensions();
    currentMode="waves";
    ensureAudio();

    /* A previous Game Over saves HP at 0. Starting any allowed wave must revive the player. */
    if(Number(save.player_health) <= 0){
        save.player_health = Number(save.player_max_health) || 100;
        saveGame();
    }

    waveState={
        wave:selectedWave,
        player:{x:WIDTH/2,y:HEIGHT/2,maxHealth:save.player_max_health,health:save.player_health,damage:save.player_damage,speed:save.player_speed,range:save.player_attack_range,cooldown:0},
        enemies:[],particles:[],texts:[],effects:[],pickups:[],running:true,finished:false
    };
    renderWavePage();
    spawnWave(waveState.wave);
}
function renderWavePage(){
    setResponsiveWaveDimensions();
    render(`<div class="wave-page"><canvas id="waveCanvas" class="game" width="${WIDTH}" height="${HEIGHT}"></canvas><div class="waveHUD"><div class="waveHP"><div id="hpFill"></div><span id="hpText">HP</span></div><div class="txt" id="candyText">Candy: ${save.candy_credits}</div><div class="txt" id="waveText">Wave ${waveState.wave}/${MAX_WAVES}</div><div class="txt" id="cardText">Cards ${countCards()}</div></div><div class="waveButtons"><button class="purple small" onclick="petsPage()">PETS</button><button class="blue small" onclick="cardsPage()">CARDS</button><button class="orange small" onclick="skinsPage()">SKIN</button><button class="gold small" onclick="openUpgradeShop()">UPGRADES</button><button class="gray small" onclick="pauseWaves()">||</button></div><div class="touch-joystick" id="joy"><div class="touch-knob" id="joyKnob"></div></div><button class="attack-touch" id="attackTouch">ATTACK</button></div>`);
    const c=document.getElementById("waveCanvas");
    c.addEventListener("pointerdown",e=>{if(e.target===c)waveAttack();});
    document.getElementById("attackTouch").addEventListener("pointerdown",e=>{e.preventDefault();waveAttack();});
    setupJoystick();
    lastWaveTime=performance.now();
    requestAnimationFrame(waveLoop);
}
function spawnWave(w){
    waveState.enemies=[];
    waveState.wave=Math.max(1,Math.min(MAX_WAVES,Math.floor(Number(w)||1)));
    w=waveState.wave;
    // Enemy counts stay capped so late waves remain playable on phones/tablets.
    const enemyCount=Math.min(50,5+w*2);
    if(w===MAX_WAVES){
        spawnEnemy("final_boss",true);
        sfxBoss();
        for(let i=0;i<12;i++)spawnEnemy(Math.random()<.5?"broccoli":"steak");
        toast("WAVE 300 — FINAL BOSS: THE ULTIMATE CANDY GOD!");
        return;
    }
    if(w%5===0){
        const n=Math.max(1,enemyCount-1);
        sfxBoss();
        spawnEnemy(Math.random()<.5?"broccoli":"steak",true);
        for(let i=0;i<n;i++)spawnEnemy(Math.random()<.5?"broccoli":"steak");
        toast(bossNameForWave(w)+" APPEARS!");
    }else{
        for(let i=0;i<enemyCount;i++)spawnEnemy(Math.random()<.5?"broccoli":"steak");
        toast("WAVE "+w+"!");
    }
}
function spawnEnemy(type,boss=false){
    const side=Math.floor(Math.random()*4);let x,y;
    if(side===0){x=50+Math.random()*(WIDTH-100);y=100;}
    else if(side===1){x=WIDTH-50;y=100+Math.random()*(HEIGHT-150);}
    else if(side===2){x=50+Math.random()*(WIDTH-100);y=HEIGHT-50;}
    else{x=50;y=100+Math.random()*(HEIGHT-150);}
    const w=waveState.wave;
    let e={type,x,y,boss,alive:true,attackTimer:boss?.7:(.2+Math.random()*.8)};
    e.bossDesign = (boss || type==="final_boss") ? bossDesignForWave(w) : null;
    if(type==="final_boss"){
        e.radius=82;
        e.maxHealth=3000+w*100;
        e.health=e.maxHealth;
        e.speed=.65+Math.min(.45,w/1000);
        e.damage=85+Math.floor(w/10);
        e.attackTimer=.7;
    }
    else if(type==="broccoli"){
        e.radius=28;
        e.maxHealth=35+w*5;
        e.health=e.maxHealth;
        e.speed=1.2+w*.025;
        e.damage=7+Math.floor(w/4);
    }
    else{
        e.radius=30;
        e.maxHealth=50+w*7;
        e.health=e.maxHealth;
        e.speed=.9+w*.02;
        e.damage=10+Math.floor(w/3);
    }
    // Every five waves, the boss gets stronger as the campaign advances.
    if(boss&&type!=="final_boss"){
        const tier=Math.max(1,Math.floor((w-1)/50)+1);
        e.maxHealth*=5+Math.min(10,tier-1);
        e.health=e.maxHealth;
        e.radius*=1.55+Math.min(.35,tier*.025);
        e.speed*=Math.max(.60,.75-tier*.01);
        e.damage*=2+Math.min(3,Math.floor((tier-1)/2));
    }
    e.name=bossNameForWave(w);
    e.color=bossColorForWave(w);
    waveState.enemies.push(e);
}
function totalPet(stat){const p=pet(save.equipped_pet);return p?Number(p[stat]||0):0;}
function totalDamage(){return save.player_damage+totalPet("damage");}
function totalSpeed(){return save.player_speed+totalPet("speed");}
function totalRange(){return save.player_attack_range+totalPet("range");}
function totalCreditBonus(){return totalPet("credits");}
function waveAttack(){
    if(!waveState||!waveState.running)return;
    sfxAttack();
    const p=waveState.player;if(p.cooldown>0)return;p.cooldown=.35;waveState.effects.push({x:p.x,y:p.y,r:totalRange(),life:.18});
    for(const e of waveState.enemies){if(!e.alive)continue;const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<=totalRange()+e.radius){e.health-=totalDamage();sfxHit();hitParticles(e.x,e.y);textEffect(e.x,e.y-35,"-"+Math.round(totalDamage()),C.YELLOW);if(e.health<=0)killEnemy(e);}}
}
function killEnemy(e){if(!e.alive)return;sfxHit();e.alive=false;const w=waveState.wave;const reward=(e.boss?(8+Math.floor(w/2)):1)+totalCreditBonus();save.candy_credits+=reward;explosion(e.x,e.y);textEffect(e.x,e.y-40,"+"+reward+" Candy",C.YELLOW);if(e.boss){sfxWin();toast("DEFEATED: "+e.name+"!");}if(Math.random()<.35)waveState.pickups.push({x:e.x,y:e.y,value:1+Math.floor(Math.random()*4),life:10,bob:Math.random()*10});if(Math.random()<.035){const c=randomCard();save.cards_owned[c[0]]=(save.cards_owned[c[0]]||0)+1;toast("CARD DROP: "+c[0]+" ["+c[1]+"]");}if(Math.random()<.01){const p=rollPet();save.pets_owned[p.name]=(save.pets_owned[p.name]||0)+1;toast("PET DROP: "+p.name+" ["+p.rarity+"]");}saveGame();}
function hitParticles(x,y){for(let i=0;i<8;i++)waveState.particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:.6,size:3+Math.random()*5,color:[C.RED,C.YELLOW,C.ORANGE,C.WHITE][Math.floor(Math.random()*4)]});}
function explosion(x,y){for(let i=0;i<24;i++)waveState.particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:.5+Math.random()*.7,size:3+Math.random()*5,color:[C.RED,C.ORANGE,C.YELLOW,C.GREEN,C.WHITE,C.CYAN][Math.floor(Math.random()*6)]});}
function textEffect(x,y,text,color){waveState.texts.push({x,y,text,color,life:1.3});}
function damagePlayer(amount){
    const p=waveState.player;
    sfxDamage();
    p.health-=amount;
    hitParticles(p.x,p.y);
    textEffect(p.x,p.y-45,"-"+Math.round(amount),C.RED);

    if(p.health<=0){
        p.health=0;
        waveState.running=false;
        save.player_health=0;
        saveGame();

        setTimeout(()=>{
            alert("GAME OVER — WAVE "+waveState.wave);
            menu();
        },30);
    }
}
function completeWave(){
    if(waveState.finished)return;

    waveState.finished=true;
    const w=waveState.wave;
    const firstClear=w>highestWaveCleared();
    const gemReward=firstClear?(w%5===0?10:3):0;
    if(gemReward>0)save.candy_gems=(Number(save.candy_gems)||0)+gemReward;
    sfxWin();
    waveState.running=false;

    /* Save the actual HP left at the end of the wave, then apply the
       original 20% max-HP healing before the next wave. */
    save.player_health=Math.max(0,Math.min(save.player_max_health,Math.round(waveState.player.health)));
    save.highest_wave_cleared=Math.max(highestWaveCleared(),w);
    const previousProgress=Math.max(1,Math.floor(Number(save.current_wave)||1));

    if(w<MAX_WAVES){
        // A replay must never push the campaign's next wave backwards.
        save.current_wave=Math.max(previousProgress,w+1);
        save.current_wave=Math.min(MAX_WAVES,save.current_wave);
        save.player_health=Math.min(
            save.player_max_health,
            save.player_health+Math.floor(save.player_max_health*.2)
        );
        saveGame();
        if(gemReward>0)toast(`WAVE CLEARED! +${gemReward} CANDY GEMS 💎`);

        const unlock=save.current_wave>previousProgress?SKINS.find(s=>s[1]===save.current_wave):null;
        if(unlock)toast("NEW SKIN UNLOCKED: "+unlock[0]+"!");
        setTimeout(()=>upgradePage(),250);
    }else{
        save.current_wave=MAX_WAVES;
        save.highest_wave_cleared=Math.max(save.highest_wave_cleared,MAX_WAVES);
        save.player_health=save.player_max_health;
        saveGame();
        setTimeout(()=>{
            alert("THE ULTIMATE CANDY GOD DEFEATED! YOU CONQUERED ALL 300 WAVES!");
            menu();
        },100);
    }
}
function pauseWaves(){if(!waveState)return;waveState.running=false;render(`${topbar()}<div class="section center"><h1>PAUSED</h1><div class="panel"><button class="green" onclick="resumeWaves()">RESUME</button><button class="gray" onclick="menu()">MENU</button></div></div>`);}
function resumeWaves(){if(!waveState)return;ensureAudio();waveState.running=true;renderWavePage();}
function waveLoop(now){if(!waveState||!waveState.running)return;const dt=Math.min(.05,(now-lastWaveTime)/1000);lastWaveTime=now;updateWave(dt);drawWave();requestAnimationFrame(waveLoop);}
function updateWave(dt){
    const p=waveState.player;p.cooldown=Math.max(0,p.cooldown-dt);
    let dx=joystick.x,dy=joystick.y;
    if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;if(keys.w||keys.arrowup)dy-=1;if(keys.s||keys.arrowdown)dy+=1;
    const len=Math.hypot(dx,dy);if(len>0){dx/=len;dy/=len;p.x+=dx*totalSpeed()*60*dt;p.y+=dy*totalSpeed()*60*dt;}
    p.x=Math.max(50,Math.min(WIDTH-50,p.x));p.y=Math.max(100,Math.min(HEIGHT-70,p.y));
    for(const e of waveState.enemies){if(!e.alive)continue;const ex=p.x-e.x,ey=p.y-e.y,d=Math.hypot(ex,ey);if(d>1&&d>e.radius+45){e.x+=(ex/d)*e.speed*60*dt;e.y+=(ey/d)*e.speed*60*dt;}e.attackTimer-=dt;if(d<e.radius+45&&e.attackTimer<=0){damagePlayer(e.damage);e.attackTimer=e.type==="final_boss"?.75:1.0;}}
    for(const pick of waveState.pickups){pick.life-=dt;pick.bob+=dt*5;pick.y+=Math.sin(pick.bob)*.04;const d=Math.hypot(p.x-pick.x,p.y-pick.y);if(d<42){sfxCollect();save.candy_credits+=pick.value;pick.life=0;saveGame();}}
    waveState.pickups=waveState.pickups.filter(x=>x.life>0);
    for(const x of waveState.particles){x.life-=dt;x.x+=x.vx*60*dt;x.y+=x.vy*60*dt;x.vy+=3*dt;}
    waveState.particles=waveState.particles.filter(x=>x.life>0);
    for(const x of waveState.texts){x.life-=dt;x.y-=35*dt;}waveState.texts=waveState.texts.filter(x=>x.life>0);
    for(const x of waveState.effects)x.life-=dt;waveState.effects=waveState.effects.filter(x=>x.life>0);
    waveState.enemies=waveState.enemies.filter(e=>e.alive);
    if(waveState.enemies.length===0)completeWave();
    document.getElementById("hpFill").style.width=(Math.max(0,p.health/p.maxHealth)*100)+"%";document.getElementById("hpText").textContent=`HP ${Math.round(p.health)}/${p.maxHealth}`;document.getElementById("candyText").textContent=`Candy: ${save.candy_credits}`;document.getElementById("waveText").textContent=`Wave ${waveState.wave}/${MAX_WAVES}`;
}
function drawWave(){
    const c=document.getElementById("waveCanvas");if(!c)return;const ctx=c.getContext("2d");
    ctx.fillStyle=C.DARK_BG;ctx.fillRect(0,0,WIDTH,HEIGHT);ctx.strokeStyle="rgba(255,255,255,.035)";ctx.lineWidth=1;
    for(let y=100;y<HEIGHT;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WIDTH,y);ctx.stroke();}for(let x=0;x<WIDTH;x+=50){ctx.beginPath();ctx.moveTo(x,85);ctx.lineTo(x,HEIGHT);ctx.stroke();}
    for(const p of waveState.pickups){ctx.fillStyle=C.GOLD;ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle=C.YELLOW;ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle=C.WHITE;ctx.beginPath();ctx.arc(p.x-3,p.y-3,3,0,Math.PI*2);ctx.fill();}
    for(const e of waveState.enemies)drawEnemy(ctx,e);drawPlayer(ctx,waveState.player.x,waveState.player.y);drawEquippedPet(ctx,waveState.player.x+78,waveState.player.y+10);
    for(const e of waveState.effects){ctx.strokeStyle=C.YELLOW;ctx.lineWidth=5;ctx.globalAlpha=Math.max(0,e.life/.18);ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1+(.18-e.life)*1.2),0,Math.PI*2);ctx.stroke();}ctx.globalAlpha=1;
    for(const p of waveState.particles){ctx.globalAlpha=Math.max(0,p.life/1.2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,p.size),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
    for(const t of waveState.texts){ctx.globalAlpha=Math.max(0,t.life/1.3);ctx.fillStyle=t.color;ctx.font="25px Arial";ctx.textAlign="center";ctx.fillText(t.text,t.x,t.y);}ctx.globalAlpha=1;
}

// Every pet gets its own simple canvas drawing. No emoji are used
// for equipped pets in the actual wave arena.
// ================================================================
function drawPetArt(ctx,x,y,p,scale=1){
    const n=p.name;
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.lineJoin="round";
    ctx.lineCap="round";

    const D="#17131c";
    const W="#ffffff";
    const P=C.PINK;
    const Y=C.YELLOW;
    const G=C.GREEN;
    const B=C.BLUE;
    const O=C.ORANGE;
    const R=C.RED;
    const Pu=C.PURPLE;
    const Br=C.BROWN;
    const DB=C.DARK_BROWN;

    const circ=(cx,cy,r,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();};
    const ell=(cx,cy,rx,ry,col,rot=0)=>{ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,rot,0,Math.PI*2);ctx.fill();};
    const rect=(rx,ry,rw,rh,col,rad=0)=>{ctx.fillStyle=col;if(rad){ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,rad);ctx.fill();}else ctx.fillRect(rx,ry,rw,rh);};
    const poly=(pts,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();};
    const eye=(ex,ey,col=Y,r=4)=>{circ(ex,ey,r,col);circ(ex,ey,r*.45,D);};
    const line=(x1,y1,x2,y2,col=W,w=2)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();};
    const shadow=()=>ell(0,30,30,7,"rgba(0,0,0,.35)");

    shadow();

    if(n==="Chipy"){
        ell(0,7,34,24,"#35353d");
        circ(0,-17,29,"#3f4048");
        poly([[-24,-36],[-17,-62],[-3,-41]],"#3f4048");
        poly([[24,-36],[17,-62],[3,-41]],"#3f4048");
        circ(0,-9,18,W);
        eye(-10,-21,"#ffe35a",5); eye(10,-21,"#ffe35a",5);
        circ(0,-9,3,"#111");
        ctx.strokeStyle="#111";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-5,7,.15,2.95);ctx.stroke();
        line(-18,-8,-38,-13,"#eee",2);line(-18,-3,-40,2,"#eee",2);line(18,-8,38,-13,"#eee",2);line(18,-3,40,2,"#eee",2);
        return ctx.restore();
    }

    if(n==="Candy Worm"){
        const colors=[P,Y,G,B];
        for(let i=0;i<5;i++){circ(-30+i*15,8-(i%2)*5,12,colors[i%4]);}
        eye(35,-2,W,3);return ctx.restore();
    }

    if(n==="Gumdrop Mouse"){
        ell(0,7,25,19,Pu);circ(-15,-16,11,"#c18bef");circ(15,-16,11,"#c18bef");eye(-8,-2);eye(8,-2);line(24,8,43,16,P,3);circ(0,4,3,P);return ctx.restore();
    }

    if(n==="Marshmallow Bunny"){
        ell(0,6,25,20,"#fff0f5");ell(-11,-31,9,24,W);ell(11,-31,9,24,W);circ(-9,-12,4,D);circ(9,-12,4,D);circ(0,-3,4,P);return ctx.restore();
    }

    if(n==="Cookie Cat"){
        ell(0,8,29,21,"#a86b36");circ(0,-17,26,"#d39a58");poly([[-22,-34],[-13,-56],[-3,-39]],"#b87c40");poly([[22,-34],[13,-56],[3,-39]],"#b87c40");eye(-9,-19);eye(9,-19);circ(-14,-3,3,DB);circ(14,2,3,DB);circ(2,5,3,DB);return ctx.restore();
    }

    if(n==="Donut Puppy"){
        ell(0,8,29,21,"#a96331");circ(0,-16,25,"#d58a50");ell(-20,-16,10,16,"#8b512d",-.4);ell(20,-16,10,16,"#8b512d",.4);eye(-8,-18);eye(8,-18);ell(0,-5,7,4,P);line(-4,4,4,4,"#4b2518",2);return ctx.restore();
    }

    if(n==="Cupcake Bird"){
        ell(0,9,25,19,B);ell(-4,-12,26,17,P);poly([[18,-3],[38,3],[18,8]],Y);poly([[-12,2],[-36,-14],[-24,12]],"#ff82ba");eye(-7,-17,W,3);eye(7,-17,W,3);return ctx.restore();
    }

    if(n==="Chocolate Fox"){
        ell(0,8,29,21,"#b65d2c");circ(0,-17,26,"#e18a46");poly([[-23,-35],[-14,-60],[-3,-39]],Br);poly([[23,-35],[14,-60],[3,-39]],Br);poly([[-14,-18],[-3,-5],[-22,-2]],"#f4c58d");poly([[14,-18],[3,-5],[22,-2]],"#f4c58d");eye(-9,-20,Y,4);eye(9,-20,Y,4);return ctx.restore();
    }

    if(n==="Ice Cream Bunny"){
        ell(0,7,25,19,"#dff7ff");ell(-11,-33,8,24,"#e9faff");ell(11,-33,8,24,"#e9faff");circ(-8,-18,12,P);circ(9,-21,12,C.LIGHT_BLUE);eye(-8,-7);eye(8,-7);return ctx.restore();
    }

    if(n==="Fire Candy Dragon"){
        ell(0,7,31,22,"#8b281f");circ(0,-17,28,O);poly([[-24,-36],[-15,-61],[-2,-38]],R);poly([[24,-36],[15,-61],[2,-38]],R);poly([[0,10],[27,1],[22,20]],Y);eye(-10,-21,Y,4);eye(10,-21,Y,4);ctx.fillStyle=Y;ctx.beginPath();ctx.moveTo(-8,-55);ctx.lineTo(0,-73);ctx.lineTo(8,-55);ctx.closePath();ctx.fill();return ctx.restore();
    }

    if(n==="Candy Dragon"){
        ell(0,7,31,22,G);circ(0,-17,28,"#54e28b");poly([[-24,-36],[-15,-60],[-2,-39]],G);poly([[24,-36],[15,-60],[2,-39]],G);ctx.strokeStyle=G;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(24,12);ctx.quadraticCurveTo(50,31,42,2);ctx.stroke();eye(-10,-21,W,4);eye(10,-21,W,4);return ctx.restore();
    }

    if(n==="Golden Candy Dragon"){
        ell(0,7,31,22,C.GOLD);circ(0,-17,28,"#ffd86a");poly([[-24,-36],[-15,-60],[-2,-39]],C.GOLD);poly([[24,-36],[15,-60],[2,-39]],C.GOLD);circ(-10,-21,4,D);circ(10,-21,4,D);poly([[26,8],[46,0],[39,14]],C.GOLD);return ctx.restore();
    }

    if(n==="Galaxy Dragon"){
        ell(0,7,31,22,"#30205d");circ(0,-17,28,Pu);circ(-10,-23,4,W);circ(11,-10,3,C.LIGHT_BLUE);circ(12,-26,2,P);poly([[-24,-36],[-15,-60],[-2,-39]],Pu);poly([[24,-36],[15,-60],[2,-39]],Pu);eye(-10,-20,C.CYAN,4);eye(10,-20,C.CYAN,4);return ctx.restore();
    }

    if(n==="Void Candy Cat"){
        ell(0,8,31,22,"#26263a");circ(0,-17,28,"#343450");poly([[-23,-36],[-15,-60],[-2,-40]],"#343450");poly([[23,-36],[15,-60],[2,-40]],"#343450");eye(-10,-20,Pu,5);eye(10,-20,Pu,5);ctx.strokeStyle=Pu;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-8,8,.2,2.9);ctx.stroke();return ctx.restore();
    }

    if(n==="Frozen Cookie Wolf"){
        ell(0,8,31,22,"#cfefff");circ(0,-17,28,"#e9fbff");poly([[-24,-36],[-13,-61],[-2,-40]],C.LIGHT_BLUE);poly([[24,-36],[13,-61],[2,-40]],C.LIGHT_BLUE);poly([[-17,-8],[-5,4],[-21,7]],"#fff");poly([[17,-8],[5,4],[21,7]],"#fff");eye(-10,-20,"#4e7cff",4);eye(10,-20,"#4e7cff",4);circ(0,-9,3,DB);return ctx.restore();
    }

    if(n==="Electric Lollipop Bat"){
        ell(0,7,28,18,"#332642");poly([[-18,0],[-52,-28],[-34,17]],"#5b3d78");poly([[18,0],[52,-28],[34,17]],"#5b3d78");eye(-8,-8,C.CYAN,4);eye(8,-8,C.CYAN,4);ctx.strokeStyle=C.CYAN;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(28,-7);ctx.lineTo(39,-19);ctx.lineTo(34,2);ctx.stroke();rect(30,-46,5,27,W,2);circ(33,-50,12,P);return ctx.restore();
    }

    if(n==="Flying Airhead"){
        ell(0,0,28,22,P);poly([[-20,14],[-38,-6],[-23,-2]],W);poly([[20,14],[38,-6],[23,-2]],W);eye(-9,-4);eye(9,-4);line(-4,7,4,7,D,2);return ctx.restore();
    }

    if(n==="Swedish Fish"){
        ctx.fillStyle=R;ctx.beginPath();ctx.moveTo(-35,8);ctx.quadraticCurveTo(-12,-23,18,-8);ctx.quadraticCurveTo(37,2,20,16);ctx.quadraticCurveTo(-4,30,-35,8);ctx.fill();poly([[-28,4],[-47,-12],[-39,9]],R);eye(11,-6,W,3);return ctx.restore();
    }

    if(n==="Melting Chocolate"){
        rect(-34,-20,68,55,"#8b4c27",12);circ(-16,-24,12,"#c07a44");circ(6,-28,14,"#c07a44");circ(24,-22,10,"#c07a44");eye(-10,-2);eye(10,-2);return ctx.restore();
    }

    if(n==="Caramel Apple"){
        circ(0,-6,29,"#d94b35");rect(-5,16,10,27,Br,4);ctx.strokeStyle="#e0a75c";ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-3,19,.1,2.5);ctx.stroke();return ctx.restore();
    }

    if(n==="Diamond Candy Dragon"){
        ell(0,7,31,22,C.LIGHT_BLUE);poly([[-24,-36],[-15,-61],[-2,-39]],C.LIGHT_BLUE);poly([[24,-36],[15,-61],[2,-39]],C.LIGHT_BLUE);poly([[0,-50],[16,-23],[0,8],[-16,-23]],W);eye(-10,-19,C.CYAN,4);eye(10,-19,C.CYAN,4);return ctx.restore();
    }

    if(n==="Star Candy Wolf"){
        ell(0,8,31,22,"#6d69a8");circ(0,-18,27,"#8c86c8");poly([[-23,-36],[-13,-62],[-2,-40]],"#7771b4");poly([[23,-36],[13,-62],[2,-40]],"#7771b4");eye(-10,-21,Y,4);eye(10,-21,Y,4);poly([[0,-4],[4,4],[12,4],[6,10],[8,18],[0,13],[-8,18],[-6,10],[-12,4],[-4,4]],Y);return ctx.restore();
    }

    if(n==="Crystal Sugar Fox"){
        ell(0,8,29,21,"#7ce8ed");circ(0,-18,26,"#b9ffff");poly([[-23,-36],[-14,-60],[-3,-40]],C.CYAN);poly([[23,-36],[14,-60],[3,-40]],C.CYAN);poly([[0,-42],[9,-25],[0,-8],[-9,-25]],W);eye(-9,-20,C.PURPLE,4);eye(9,-20,C.PURPLE,4);return ctx.restore();
    }

    if(n==="Ultimate Candy Dragon"){
        ell(0,8,33,23,"#b51f39");circ(0,-18,30,R);poly([[-26,-38],[-18,-67],[-3,-42]],R);poly([[26,-38],[18,-67],[3,-42]],R);poly([[-9,0],[0,-20],[9,0],[0,18]],C.GOLD);eye(-10,-21,Y,5);eye(10,-21,Y,5);return ctx.restore();
    }

    if(n==="Overpowered Lollipop"){
        ell(0,8,32,23,"#ff46b2");circ(0,-18,29,"#ff69c5");rect(-4,-48,8,32,W,3);circ(0,-52,17,C.CYAN);circ(0,-52,9,C.YELLOW);eye(-10,-20,W,4);eye(10,-20,W,4);return ctx.restore();
    }

    if(n==="Candy Destroyer"){
        ell(0,9,34,23,"#4e1a59");circ(0,-18,31,"#7e1b9c");poly([[-27,-38],[-18,-66],[-3,-42]],"#a92bd0");poly([[27,-38],[18,-66],[3,-42]],"#a92bd0");circ(-11,-20,5,C.RED);circ(11,-20,5,C.RED);ctx.strokeStyle=C.RED;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-3,12,0,Math.PI);ctx.stroke();return ctx.restore();
    }

    if(n==="Original Candy God"){
        ell(0,8,35,24,"#c8a1ff");circ(0,-18,31,"#b37cff");poly([[-31,-34],[-19,-65],[-6,-45],[0,-67],[8,-45],[21,-65],[31,-34]],C.GOLD);eye(-11,-20,W,5);eye(11,-20,W,5);return ctx.restore();
    }

    if(n==="Original Void Dragon"){
        ell(0,8,35,24,"#222234");circ(0,-18,31,"#141421");poly([[-29,-36],[-20,-70],[-4,-43]],Pu);poly([[29,-36],[20,-70],[4,-43]],Pu);eye(-11,-20,"#ff29c9",5);eye(11,-20,"#ff29c9",5);ctx.strokeStyle="#ff29c9";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(25,5);ctx.quadraticCurveTo(55,25,42,-6);ctx.stroke();return ctx.restore();
    }

    if(n==="Original Rainbow God"){
        ell(0,8,35,24,"#f4f4ff");for(const [r,c] of[[34,R],[28,O],[22,Y],[16,G],[10,B]])circ(0,-18,r,c);poly([[-31,-34],[-19,-65],[-5,-43],[0,-67],[8,-43],[21,-65],[31,-34]],C.GOLD);eye(-11,-20,W,5);eye(11,-20,W,5);return ctx.restore();
    }

    if(n==="Ghost Candy"){
        ctx.fillStyle="#e8e7f4";ctx.beginPath();ctx.moveTo(-30,20);ctx.arc(0,-14,30,Math.PI,0);ctx.lineTo(30,20);ctx.lineTo(15,8);ctx.lineTo(0,20);ctx.lineTo(-15,8);ctx.closePath();ctx.fill();eye(-10,-17,Pu,5);eye(10,-17,Pu,5);return ctx.restore();
    }

    if(n==="Glitched Cookie"){
        rect(-31,-38,62,62,"#d0a067",10);rect(-36,-23,18,7,C.CYAN,2);rect(18,-7,18,7,P,2);rect(-17,8,22,6,C.RED,2);circ(-12,-18,4,DB);circ(11,-2,4,DB);return ctx.restore();
    }

    if(n==="Shadow Lollipop"){
        ell(0,9,30,21,"#22222e");circ(0,-18,29,"#181820");ctx.strokeStyle=Pu;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-18,26,0,Math.PI*2);ctx.stroke();rect(-4,8,8,35,"#555565",3);circ(-10,-20,4,R);circ(10,-20,4,R);return ctx.restore();
    }

    /* Remaining pets are deliberately different by creature type. */
    if(n.includes("Phoenix")){
        ell(0,8,31,22,O);poly([[-20,9],[-52,-27],[-13,-5]],R);poly([[20,9],[52,-27],[13,-5]],R);circ(0,-16,26,Y);eye(-9,-20,W,4);eye(9,-20,W,4);poly([[-12,20],[0,48],[12,20]],R);return ctx.restore();
    }
    if(n.includes("Bunny")){
        ell(0,8,27,20,P);ell(-11,-35,9,25,P);ell(11,-35,9,25,P);circ(-9,-10,4,W);circ(9,-10,4,W);circ(0,-2,4,R);return ctx.restore();
    }
    if(n.includes("Wolf")){
        ell(0,9,32,23,"#aebbd0");circ(0,-18,28,"#d9e2ee");poly([[-24,-36],[-14,-66],[-3,-42]],"#97a8bc");poly([[24,-36],[14,-66],[3,-42]],"#97a8bc");eye(-10,-20,R,4);eye(10,-20,R,4);poly([[-17,-7],[-5,4],[-21,5]],W);poly([[17,-7],[5,4],[21,5]],W);return ctx.restore();
    }
    if(n.includes("Cat")){
        ell(0,8,30,22,"#666273");circ(0,-18,27,"#827b8b");poly([[-23,-36],[-14,-61],[-3,-40]],"#716a7d");poly([[23,-36],[14,-61],[3,-40]],"#716a7d");eye(-9,-20,Y,4);eye(9,-20,Y,4);circ(0,-9,3,P);return ctx.restore();
    }
    if(n.includes("Fox")){
        ell(0,8,29,21,"#b96935");circ(0,-18,26,"#d8904f");poly([[-23,-36],[-14,-62],[-3,-40]],DB);poly([[23,-36],[14,-62],[3,-40]],DB);eye(-9,-20,Y,4);eye(9,-20,Y,4);return ctx.restore();
    }
    if(n.includes("Mouse")){
        ell(0,8,26,19,Pu);circ(-16,-19,12,"#b789dc");circ(16,-19,12,"#b789dc");eye(-8,-6);eye(8,-6);line(23,9,42,18,P,3);return ctx.restore();
    }
    if(n.includes("Bird")){
        ell(0,9,26,20,B);circ(0,-17,22,P);poly([[18,-3],[40,2],[18,8]],Y);poly([[-15,0],[-41,-20],[-25,13]],"#e77eb2");eye(-7,-16);eye(7,-16);return ctx.restore();
    }
    if(n.includes("Puppy")){
        ell(0,9,30,22,"#bf7b44");circ(0,-18,26,"#d59455");ell(-22,-16,10,17,"#8b512d",-.3);ell(22,-16,10,17,"#8b512d",.3);eye(-9,-19);eye(9,-19);circ(0,-6,6,D);return ctx.restore();
    }
    if(n.includes("Cookie")){
        ell(0,8,30,22,"#b9783d");circ(0,-18,26,"#d9a05e");circ(-14,-4,4,DB);circ(13,-1,4,DB);circ(0,6,4,DB);eye(-9,-20);eye(9,-20);return ctx.restore();
    }
    if(n.includes("Candy")){
        ell(0,8,30,22,P);circ(0,-18,26,P);ctx.strokeStyle=W;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-18,15,.3,2.4);ctx.stroke();eye(-9,-20);eye(9,-20);return ctx.restore();
    }
    if(n.includes("Sugar")){
        ell(0,8,28,21,"#f4dbff");circ(-10,-18,9,P);circ(10,-18,9,C.CYAN);eye(-8,-2,Pu,3);eye(8,-2,Pu,3);return ctx.restore();
    }
    const rc=RARITY_COLORS[p.rarity]||Pu;
    ell(0,8,29,21,rc);circ(0,-18,25,rc);eye(-9,-19);eye(9,-19);return ctx.restore();
}

function drawEnemy(ctx,e){
    const x=e.x,y=e.y,r=e.radius;
    if(e.boss||e.type==="final_boss")drawBoss(ctx,e);else if(e.type==="broccoli"){ctx.fillStyle=C.DARK_GREEN;ctx.fillRect(x-9,y+10,18,55);ctx.fillStyle=C.GREEN;ctx.beginPath();ctx.arc(x-15,y,18,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+15,y,18,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x,y-15,23,0,Math.PI*2);ctx.fill();ctx.fillStyle=C.BLACK;ctx.beginPath();ctx.arc(x-9,y-2,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+9,y-2,4,0,Math.PI*2);ctx.fill();}
    else{ctx.fillStyle=C.BROWN;ctx.beginPath();ctx.roundRect(x-30,y-21,60,42,9);ctx.fill();ctx.fillStyle="#b96432";ctx.beginPath();ctx.roundRect(x-24,y-15,48,30,6);ctx.strokeStyle="#b96432";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=C.DARK_BROWN;ctx.beginPath();ctx.arc(x-13,y-6,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+13,y+7,5,0,Math.PI*2);ctx.fill();}
    const bw=e.type==="final_boss"?300:r*2.2,bh=e.type==="final_boss"?14:7,ratio=Math.max(0,e.health/e.maxHealth);ctx.fillStyle=C.DARK_RED;ctx.fillRect(x-bw/2,y-r-(e.type==="final_boss"?22:18),bw,bh);ctx.fillStyle=e.type==="final_boss"?C.RED:C.RED;ctx.fillRect(x-bw/2,y-r-(e.type==="final_boss"?22:18),bw*ratio,bh);ctx.font=e.type==="final_boss"?"24px Arial":"17px Arial";ctx.textAlign="center";ctx.fillStyle=e.type==="final_boss"?C.RED:C.YELLOW;if(e.boss||e.type==="final_boss")ctx.fillText(e.name||"BOSS",x,y-r-30);
}
function drawBoss(ctx,e){
    const x=e.x,y=e.y,r=e.radius,w=waveState.wave;
    const design=e.bossDesign||bossDesignForWave(w);
    if(design&&design.form!=="final"){
        drawDesignedBoss(ctx,e,design);
        return;
    }
    if(e.type==="final_boss"){
        // Wave 300 has its own crowned, cosmic final-boss silhouette.
        const d=design||{color:"#2d1238",accent:C.GOLD};
        ctx.save();ctx.translate(x,y);
        ctx.fillStyle=d.color;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=d.accent;ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,r+8,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle=C.RED;ctx.beginPath();ctx.moveTo(-r*.62,-r*.45);ctx.lineTo(-r*.42,-r*1.12);ctx.lineTo(-r*.17,-r*.54);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(r*.62,-r*.45);ctx.lineTo(r*.42,-r*1.12);ctx.lineTo(r*.17,-r*.54);ctx.closePath();ctx.fill();
        ctx.fillStyle=d.accent;ctx.beginPath();ctx.moveTo(-r*.62,-r*.55);ctx.lineTo(-r*.4,-r*.92);ctx.lineTo(-r*.16,-r*.59);ctx.lineTo(0,-r*1.16);ctx.lineTo(r*.16,-r*.59);ctx.lineTo(r*.4,-r*.92);ctx.lineTo(r*.62,-r*.55);ctx.closePath();ctx.fill();
        for(const ex of [-r*.25,r*.25]){ctx.fillStyle="#fff49a";ctx.beginPath();ctx.ellipse(ex,-r*.14,r*.13,r*.16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#100b1d";ctx.beginPath();ctx.arc(ex,-r*.14,r*.055,0,Math.PI*2);ctx.fill();}
        ctx.restore();return;
    }

function setNet(text){const x=document.getElementById("netState");if(x)x.textContent=text;}
function socketUrl(){const proto=location.protocol==="https:"?"wss":"ws";return `${proto}://${location.host}`;}
function connectSocket(){if(socket&&(socket.readyState===WebSocket.OPEN||socket.readyState===WebSocket.CONNECTING))return;try{socket=new WebSocket(socketUrl());socket.onopen=()=>setNet("CONNECTED TO SERVER");socket.onclose=()=>setNet("SERVER DISCONNECTED");socket.onerror=()=>setNet("SERVER CONNECTION ERROR");socket.onmessage=e=>handleMultiMessage(e.data);}catch{setNet("WEBSOCKET NOT AVAILABLE");}}
function sendMulti(obj){if(!socket||socket.readyState!==WebSocket.OPEN){setNet("NO SERVER CONNECTION");return false;}socket.send(JSON.stringify(obj));return true;}
function multiPlayerData(){return{username:save.username,card:save.equipped_card,pet:save.equipped_pet,trophies:save.trophies};}
function createMultiplayerRoom(){save.username=document.getElementById("multiName")?.value.trim()||"CandyPlayer";saveGame();connectSocket();setTimeout(()=>sendMulti({type:"create_room",username:save.username,player:multiPlayerData()}),250);}
function joinMultiplayerRoom(){save.username=document.getElementById("multiName")?.value.trim()||"CandyPlayer";const code=document.getElementById("roomInput")?.value.trim().toUpperCase();if(!code)return toast("ENTER A ROOM CODE!");saveGame();connectSocket();setTimeout(()=>sendMulti({type:"join_room",room:code,roomCode:code,username:save.username,player:multiPlayerData()}),250);}
function findMultiplayerMatch(){save.username=document.getElementById("multiName")?.value.trim()||"CandyPlayer";saveGame();connectSocket();setTimeout(()=>sendMulti({type:"matchmake",username:save.username,player:multiPlayerData()}),250);}
function handleMultiMessage(raw){let m;try{m=JSON.parse(raw)}catch{setNet(raw);return;}
    if(m.type==="connected"){setNet(m.message||"CONNECTED TO SERVER");return;}
    if(m.type==="room_created"){multiRoom=m.room||m.roomCode||m.code||"";setNet("ROOM CREATED: "+multiRoom);const i=document.getElementById("roomInput");if(i)i.value=multiRoom;return;}
    if(m.type==="room_joined"){multiRoom=m.room||m.roomCode||multiRoom;setNet("ROOM JOINED — WAITING FOR PLAYER");return;}
    if(m.type==="opponent_joined"){setNet("OTHER PLAYER JOINED — STARTING...");return;}
    if(m.type==="matchmaking"){setNet(m.message||"SEARCHING FOR PLAYER...");return;}
    if(m.type==="match_found"){multiRoom=m.room||multiRoom;setNet("PLAYER FOUND — STARTING BATTLE...");return;}
    if(m.type==="multiplayer_battle_start"){beginOnlineBattle(m);return;}
    if(m.type==="multiplayer_battle_state"){updateOnlineBattle(m);return;}
    if(m.type==="battle_result"){finishOnlineBattle(m);return;}
    if(m.type==="opponent_left"){setNet("OPPONENT LEFT");alert(m.message||"Opponent disconnected.");multiplayerPage();return;}
    if(m.type==="error")return setNet("SERVER ERROR: "+(m.message||"UNKNOWN"));
    setNet(m.message||m.type||"SERVER MESSAGE");}

let onlineBattle=null;
function beginOnlineBattle(msg){
    const meId=msg.you;
    const mine=(msg.state||[]).find(x=>x.id===meId);
    const opp=(msg.state||[]).find(x=>x.id!==meId)||msg.opponent;
    onlineBattle={room:msg.room,you:meId,mine,opponent:opp,turnPlayerId:msg.turnPlayerId||null,log:["ONLINE BATTLE STARTED!"],over:false};
    drawOnlineBattle();
}
function updateOnlineBattle(msg){
    if(!onlineBattle)return;
    const state=msg.state||[];
    onlineBattle.turnPlayerId=msg.turnPlayerId||null;
    onlineBattle.mine=state.find(x=>x.id===onlineBattle.you)||onlineBattle.mine;
    onlineBattle.opponent=state.find(x=>x.id!==onlineBattle.you)||onlineBattle.opponent;
    onlineBattle.log.push(msg.log||"TURN UPDATED");
    drawOnlineBattle();
}
function drawOnlineBattle(){
    if(!onlineBattle)return;
    currentMode="multiplayerBattle";
    const b=onlineBattle;
    const myCardName=b.mine.card||save.equipped_card||"Red Lollipop";
    const myCard=card(myCardName),oppCardName=b.opponent?.card||"Green Broccoli",oppCard=card(oppCardName);
    render(`${topbar()}<div class="section"><h1>ONLINE MULTIPLAYER BATTLE</h1><div class="battle-arena"><div class="battle-side left"><b>${esc(b.mine.username||save.username)}</b><div class="battle-card" style="border-color:${RARITY_COLORS[myCard[1]]}"><div class="battle-stats"><span>ONLINE</span><span>HP ${Math.round(b.mine.hp)}</span></div><canvas id="onlineMine" width="190" height="155"></canvas><b>${esc(myCardName)}</b><div style="color:${RARITY_COLORS[myCard[1]]};font-weight:900">${myCard[1]}</div></div><div class="hpbox"><div style="width:${Math.max(0,b.mine.hp/b.mine.maxHp*100)}%"></div></div></div><div class="vs">VS</div><div class="battle-side right"><b>${esc(b.opponent?.username||"Online Player")}</b><div class="battle-card" style="border-color:${RARITY_COLORS[oppCard[1]]}"><div class="battle-stats"><span>ONLINE</span><span>HP ${Math.round(b.opponent?.hp||0)}</span></div><canvas id="onlineOpp" width="190" height="155"></canvas><b>${esc(oppCardName)}</b><div style="color:${RARITY_COLORS[oppCard[1]]};font-weight:900">${oppCard[1]}</div></div><div class="hpbox"><div style="width:${Math.max(0,(b.opponent?.hp||0)/(b.opponent?.maxHp||100)*100)}%"></div></div></div></div><div class="battle-actions"><button class="red" onclick="sendOnlineBattleAction('strike')" ${b.turnPlayerId===b.you&&b.mine.hp>0?"":"disabled"}>STRIKE</button><button class="gold" onclick="sendOnlineBattleAction('power')" ${b.turnPlayerId===b.you&&b.mine.hp>0?"":"disabled"}>POWER ATTACK</button><button class="blue" onclick="sendOnlineBattleAction('pet')" ${b.turnPlayerId===b.you&&b.mine.hp>0?"":"disabled"}>PET SKILL</button><button class="gray" onclick="leaveOnlineBattle()">LEAVE</button></div><div class="log"><div>ROOM: ${esc(b.room||"NONE")}</div>${b.log.slice(-6).map(x=>`<div>${esc(x)}</div>`).join("")}</div></div>`);
    const a=document.getElementById("onlineMine"),o=document.getElementById("onlineOpp");if(a)drawCardArt(a.getContext("2d"),myCardName,a.width,a.height);if(o)drawCardArt(o.getContext("2d"),oppCardName,o.width,o.height);
}
function sendOnlineBattleAction(action){
    if(!onlineBattle||!socket)return;
    if(onlineBattle.turnPlayerId!==onlineBattle.you)return toast("WAIT FOR YOUR TURN!");
    if(!sendMulti({type:"battle_action",room:onlineBattle.room,action}))toast("NOT CONNECTED!");
}
function finishOnlineBattle(msg){
    // Ignore duplicate result packets so rewards cannot be granted twice.
    if(!onlineBattle || onlineBattle.over) return;
    onlineBattle.over = true;

    // The server sends a player-specific result based on connection/player ID.
    // Do NOT compare names: both players may use the same username.
    const won = msg.youWon === true || msg.result === "win";
    const lost = msg.youWon === false || msg.result === "loss";
    const winnerName = msg.winner || "NO WINNER";

    if(won){
        onlineBattle.log.push("YOU WIN! +25 TROPHIES +15 CANDY");
        save.wins++;
        save.trophies += 25;
        save.candy_credits += 15;
    } else if(lost){
        onlineBattle.log.push("YOU LOSE! -15 TROPHIES");
        save.losses++;
        save.trophies = Math.max(0, save.trophies - 15);
    } else {
        onlineBattle.log.push("BATTLE ENDED WITHOUT A WINNER");
    }

    setNet("BATTLE FINISHED");
    saveGame();

    const resultText = won
        ? "YOU WIN!\n+25 TROPHIES\n+15 CANDY"
        : lost
            ? "YOU LOSE!\n-15 TROPHIES\nWinner: " + winnerName
            : "BATTLE ENDED WITHOUT A WINNER";

    alert(resultText);
    onlineBattle = null;
    multiplayerPage();
}
function leaveOnlineBattle(){sendMulti({type:"leave_room"});onlineBattle=null;multiplayerPage();}

function redeemSecretCode(){
    const input=document.getElementById("secretCodeInput");
    const message=document.getElementById("secretCodeMessage");
    if(!input||!message)return;
    const code=String(input.value||"").trim().toLowerCase();
    if(!code){message.textContent="ENTER A SECRET CODE FIRST.";sfxError();return;}
    const validCodes=["12chipy34","admin","rich"];
    if(!validCodes.includes(code)){message.textContent="INVALID CODE.";sfxError();return;}
    if(!Array.isArray(save.redeemed_codes))save.redeemed_codes=[];
    if(save.redeemed_codes.includes(code)){message.textContent="THIS CODE HAS ALREADY BEEN REDEEMED.";sfxError();return;}

    let result="";
    if(code==="12chipy34"){
        save.pets_owned["Chipy"]=Math.max(1,Number(save.pets_owned["Chipy"]||0));
        result="CHIPY UNLOCKED! OPEN PETS TO EQUIP HIM.";
    }else if(code==="rich"){
        save.candy_credits+=2000;
        save.candy_gems=(Number(save.candy_gems)||0)+500;
        result="RICH CODE REDEEMED! +2,000 CANDY CREDITS AND +500 CANDY GEMS.";
    }else if(code==="admin"){
        // Unlock all collection content and all replayable waves/skins.
        for(const c of CANDY_CARDS)save.cards_owned[c[0]]=Math.max(1,Number(save.cards_owned[c[0]]||0));
        for(const p of PETS)save.pets_owned[p.name]=Math.max(1,Number(save.pets_owned[p.name]||0));
        save.highest_wave_cleared=MAX_WAVES;
        save.candy_credits+=10000;
        save.candy_gems=(Number(save.candy_gems)||0)+6000;
        result="ADMIN CODE REDEEMED! ALL CARDS, PETS AND WAVES UNLOCKED. +10,000 CANDY CREDITS AND +6,000 CANDY GEMS.";
    }
    save.redeemed_codes.push(code);
    saveGame();
    sfxCollect();
    // Refresh the modal-free menu so candy and collection totals update immediately.
    document.querySelectorAll(".modal").forEach(m=>m.remove());
    menu();
    toast(result);
}

// Add a small "new modes" control without changing the original four OG buttons.
// It is positioned at the bottom-left so DEVICE remains in the corner.
const oldMenu=menu;
menu=function(){
    oldMenu();
    const host=document.querySelector('.canvas-page');
    const b=document.createElement('button');b.textContent='NEW MODES';b.className='gray';Object.assign(b.style,{position:'absolute',left:'20px',top:'18px',fontSize:'14px',padding:'9px 13px'});b.onclick=mainMenuExtras;host.appendChild(b);
};

// ================================================================
// START
// ================================================================
menu();
</script>
