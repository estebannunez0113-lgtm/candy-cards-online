name: Build Candy Cards APK

'on':
workflow_dispatch:
push:
branches:
- main

jobs:
build-apk:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

```
  - name: Check website
    run: |
      curl -fL https://candy-cards-online.onrender.com/ -o index.html

  - name: Upload website check
    uses: actions/upload-artifact@v4
    with:
      name: candy-cards-website-check
      path: index.html
```
